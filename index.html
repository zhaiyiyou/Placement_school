                            const pb = posMap.get(nb);
                            if (!pb) return false;
                            const d = Math.abs(r - pb.r) + Math.abs(c - pb.c);
                            return d >= lo && d <= hi;
                        };
                    };
                    const C_rowBand = (rs, re) => (r, c) => r >= rs && r <= re;
                    const C_colOutside = (cs, ce) => (r, c) => c < cs || c > ce;
                    const C_colRange = (sc, ec) => (r, c) => c >= sc && c <= ec;
                    const C_sameRow = (nb) => {
                        ruleLocked.add(nb);
                        return (r, c) => { const pb = posMap.get(nb); return !!pb && pb.r === r; };
                    };
                    const C_diffRow = (nb) => {
                        ruleLocked.add(nb);
                        return (r, c) => { const pb = posMap.get(nb); return !!pb && pb.r !== r; };
                    };
                    const C_diag = (nb) => {
                        ruleLocked.add(nb);
                        return (r, c) => {
                            const pb = posMap.get(nb);
                            if (!pb) return false;
                            return Math.abs(r - pb.r) === 1 && Math.abs(c - pb.c) === 1;
                        };
                    };
                    const C_corner = () => (r, c) => (r === 0 || r === R - 1) && (c === 0 || c === C - 1);
                    // 同桌：同一行，且两列属于同一张课桌（每两列一桌，中间是过道）
                    // 0 基列号配对为 (0,1) (2,3) (4,5) (6,7)，即 c ^ 1 是同桌列
                    const C_desk = (nb) => {
                        ruleLocked.add(nb);
                        return (r, c) => {
                            const pb = posMap.get(nb);
                            if (!pb) return false;
                            return r === pb.r && (c ^ 1) === pb.c;
                        };
                    };

                    // 双人关系（距离/相邻/同行/异行/斜角）都是对称的：约束同时登记给双方，
                    // 这样后一条规则移动"另一个人"时也不会破坏前一对关系。
                    const addPairConstraint = (a, b, makeFn) => {
                        addConstraint(a, makeFn(b));
                        addConstraint(b, makeFn(a));
                    };

                    for (const rule of this.rules) {
                        if (!rule || rule.length < 3 || rule.length > 7) continue;
                        const modeId = rule[0];

                        // === 模式 '2'：固定座位（无条件，最高优先级；交换后清除双方约束）===
                        if (modeId === '2') {
                            if (rule.length !== 4) continue;
                            const name = rule[1], tr = parseInt(rule[2]), tc = parseInt(rule[3]);
                            if (isNaN(tr) || isNaN(tc)) continue;
                            const pos = posMap.get(name);
                            if (!pos || (pos.r === tr && pos.c === tc)) continue;
                            const occ = this.ans[tr][tc];
                            this._swapSeats(pos.r, pos.c, tr, tc, posMap);
                            clearConstraints(name);
                            if (occ && occ !== ' ') clearConstraints(occ);
                            continue;
                        }

                        // === 模式 '3'：概率行调整 (3 name prob% | 3 name rowMin rowMax prob%) ===
                        if (modeId === '3') {
                            if (rule.length !== 3 && rule.length !== 5) continue;
                            const name = rule[1];
                            let rMin = 4, rMax = 6, probVal;
                            if (rule.length === 3) probVal = parseInt(rule[2]);
                            else {
                                rMin = parseInt(rule[2]) - 1; rMax = parseInt(rule[3]) - 1; probVal = parseInt(rule[4]);
                                if (isNaN(rMin) || isNaN(rMax) || rMin < 0 || rMax >= R || rMin > rMax) continue;
                            }
                            if (isNaN(probVal) || probVal < 0 || probVal > 100 || rng() * 100 >= probVal) continue;
                            const pos = posMap.get(name);
                            if (!pos || fixedSeats.has(name)) continue;
                            const satisfied = (pos.r >= rMin && pos.r <= rMax);
                            if (!satisfied) {
                                const cands = [];
                                for (let r = rMin; r <= rMax; r++)
                                    for (let c = 0; c < C; c++)
                                        if ((r !== pos.r || c !== pos.c) && passConstraints(name, r, c)) cands.push({ r, c });
                                const avail = this._tryCollectAvailable(cands, name, posMap, fixedSeats, protectedByRule3, protectedByDistance, constraintMap);
                                if (this._pickAndSwap(avail, pos.r, pos.c, posMap, protectedByRule3)) addConstraint(name, C_rowBand(rMin, rMax));
                            } else {
                                addConstraint(name, C_rowBand(rMin, rMax));
                            }
                            continue;
                        }

                        // === 模式 '4'：列排除 (4 name colStart colEnd [prob%]) ===
                        if (modeId === '4') {
                            if (rule.length !== 4 && rule.length !== 5) continue;
                            const name = rule[1], cs = parseInt(rule[2]), ce = parseInt(rule[3]);
                            let probVal = rule.length === 5 ? parseInt(rule[4]) : 100;
                            if (isNaN(cs) || isNaN(ce) || cs < 1 || ce > C || cs > ce || isNaN(probVal) || probVal < 0 || probVal > 100) continue;
                            if (rng() * 100 >= probVal) continue;
                            const pos = posMap.get(name);
                            if (!pos || fixedSeats.has(name)) continue;
                            const satisfied = (pos.c < cs - 1 || pos.c > ce - 1);
                            if (!satisfied) {
                                const cands = [];
                                for (let r = 0; r < R; r++)
                                    for (let c = 0; c < C; c++)
                                        if ((c < cs - 1 || c > ce - 1) && (r !== pos.r || c !== pos.c) && passConstraints(name, r, c)) cands.push({ r, c });
                                const avail = this._tryCollectAvailable(cands, name, posMap, fixedSeats, protectedByRule3, protectedByDistance, constraintMap);
                                if (this._pickAndSwap(avail, pos.r, pos.c, posMap, protectedByDistance)) addConstraint(name, C_colOutside(cs - 1, ce - 1));
                            } else {
                                addConstraint(name, C_colOutside(cs - 1, ce - 1));
                            }
                            continue;
                        }

                        // === 模式 '5'：行范围 (5 name rowMin rowMax [prob%]) ===
                        if (modeId === '5') {
                            if (rule.length !== 4 && rule.length !== 5) continue;
                            const name = rule[1], rs = parseInt(rule[2]) - 1, re = parseInt(rule[3]) - 1;
                            let probVal = rule.length === 5 ? parseInt(rule[4]) : 100;
                            if (isNaN(rs) || isNaN(re) || rs < 0 || re >= R || rs > re || isNaN(probVal) || probVal < 0 || probVal > 100) continue;
                            if (rng() * 100 >= probVal) continue;
                            const pos = posMap.get(name);
                            if (!pos || fixedSeats.has(name)) continue;
                            const satisfied = (pos.r >= rs && pos.r <= re);
                            if (!satisfied) {
                                const cands = [];
                                for (let r = rs; r <= re; r++)
                                    for (let c = 0; c < C; c++)
                                        if ((r !== pos.r || c !== pos.c) && passConstraints(name, r, c)) cands.push({ r, c });
                                const avail = this._tryCollectAvailable(cands, name, posMap, fixedSeats, protectedByRule3, protectedByDistance, constraintMap);
                                if (this._pickAndSwap(avail, pos.r, pos.c, posMap, protectedByDistance)) addConstraint(name, C_rowBand(rs, re));
                            } else {
                                addConstraint(name, C_rowBand(rs, re));
                            }
                            continue;
                        }

                        // === 模式 '6'：必须相邻（曼哈顿距离=1）(6 name1 name2 [prob%]) ===
                        if (modeId === '6') {
                            if (rule.length !== 3 && rule.length !== 4) continue;
                            const n1 = rule[1], n2 = rule[2];
                            let probVal = rule.length === 4 ? parseInt(rule[3]) : 100;
                            if (n1 === n2 || isNaN(probVal) || probVal < 0 || probVal > 100 || rng() * 100 >= probVal) continue;
                            const p1 = posMap.get(n1), p2 = posMap.get(n2);
                            if (!p1 || !p2 || fixedSeats.has(n1)) continue;
                            const satisfied = (Math.abs(p1.r - p2.r) + Math.abs(p1.c - p2.c) === 1);
                            if (!satisfied) {
                                const cands = [];
                                for (let r = 0; r < R; r++)
                                    for (let c = 0; c < C; c++)
                                        if ((r !== p2.r || c !== p2.c) && Math.abs(r - p2.r) + Math.abs(c - p2.c) === 1 && passConstraints(n1, r, c))
                                            cands.push({ r, c });
                                const avail = this._tryCollectAvailable(cands, n1, posMap, fixedSeats, protectedByRule3, protectedByDistance, constraintMap);
                                if (this._pickAndSwap(avail, p1.r, p1.c, posMap, protectedByDistance)) addPairConstraint(n1, n2, (x) => C_dist(x, 1, 1));
                            } else {
                                addPairConstraint(n1, n2, (x) => C_dist(x, 1, 1));
                            }
                            continue;
                        }

                        // === 模式 '7'：必须同行 (7 name1 name2 [prob%]) ===
                        if (modeId === '7') {
                            if (rule.length !== 3 && rule.length !== 4) continue;
                            const n1 = rule[1], n2 = rule[2];
                            let probVal = rule.length === 4 ? parseInt(rule[3]) : 100;
                            if (n1 === n2 || isNaN(probVal) || probVal < 0 || probVal > 100 || rng() * 100 >= probVal) continue;
                            const p1 = posMap.get(n1), p2 = posMap.get(n2);
                            if (!p1 || !p2 || fixedSeats.has(n1)) continue;
                            if (p1.r === p2.r) { addPairConstraint(n1, n2, (x) => C_sameRow(x)); continue; }
                            const cands = [];
                            for (let c = 0; c < C; c++)
                                if (c !== p2.c && passConstraints(n1, p2.r, c)) cands.push({ r: p2.r, c });
                            const avail = this._tryCollectAvailable(cands, n1, posMap, fixedSeats, protectedByRule3, protectedByDistance, constraintMap);
                            if (this._pickAndSwap(avail, p1.r, p1.c, posMap, protectedByDistance)) addPairConstraint(n1, n2, (x) => C_sameRow(x));
                            continue;
                        }

                        // === 模式 '8'：必须不同行 (8 name1 name2 [prob%]) ===
                        if (modeId === '8') {
                            if (rule.length !== 3 && rule.length !== 4) continue;
                            const n1 = rule[1], n2 = rule[2];
                            let probVal = rule.length === 4 ? parseInt(rule[3]) : 100;
                            if (n1 === n2 || isNaN(probVal) || probVal < 0 || probVal > 100 || rng() * 100 >= probVal) continue;
                            const p1 = posMap.get(n1), p2 = posMap.get(n2);
                            if (!p1 || !p2 || fixedSeats.has(n1)) continue;
                            if (p1.r !== p2.r) { addPairConstraint(n1, n2, (x) => C_diffRow(x)); continue; }
                            const cands = [];
                            for (let r = 0; r < R; r++)
                                for (let c = 0; c < C; c++)
                                    if (r !== p2.r && (r !== p1.r || c !== p1.c) && passConstraints(n1, r, c)) cands.push({ r, c });
                            const avail = this._tryCollectAvailable(cands, n1, posMap, fixedSeats, protectedByRule3, protectedByDistance, constraintMap);
                            if (this._pickAndSwap(avail, p1.r, p1.c, posMap, protectedByDistance)) addPairConstraint(n1, n2, (x) => C_diffRow(x));
                            continue;
                        }

                        // === 模式 '9'：角落座位偏好 (9 name [prob%]) ===
                        if (modeId === '9') {
                            if (rule.length !== 2 && rule.length !== 3) continue;
                            const name = rule[1];
                            let probVal = rule.length === 3 ? parseInt(rule[2]) : 100;
                            if (isNaN(probVal) || probVal < 0 || probVal > 100 || rng() * 100 >= probVal) continue;
                            const pos = posMap.get(name);
                            if (!pos || fixedSeats.has(name)) continue;
                            const corners = [{ r: 0, c: 0 }, { r: 0, c: C - 1 }, { r: R - 1, c: 0 }, { r: R - 1, c: C - 1 }];
                            const isCorner = corners.some(k => k.r === pos.r && k.c === pos.c);
                            if (isCorner) { addConstraint(name, C_corner()); continue; }
                            const avail = this._tryCollectAvailable(corners, name, posMap, fixedSeats, protectedByRule3, protectedByDistance, constraintMap);
                            if (this._pickAndSwap(avail, pos.r, pos.c, posMap, protectedByDistance)) addConstraint(name, C_corner());
                            continue;
                        }

                        // === 模式 'A'：左右偏好 (A name [L|R] [prob%]) ===
                        if (modeId === 'A') {
                            if (rule.length !== 2 && rule.length !== 3 && rule.length !== 4) continue;
                            const name = rule[1];
                            let side = rule.length >= 3 && (rule[2] === 'L' || rule[2] === 'R') ? rule[2] : null;
                            let probVal = 100;
                            if (side && rule.length === 4) probVal = parseInt(rule[3]);
                            else if (!side && rule.length === 3) probVal = parseInt(rule[2]);
                            if (isNaN(probVal) || probVal < 0 || probVal > 100 || rng() * 100 >= probVal) continue;
                            const pos = posMap.get(name);
                            if (!pos || fixedSeats.has(name)) continue;
                            const sc = side === 'L' ? 0 : side === 'R' ? Math.ceil(C / 2) : null;
                            const ec = side === 'L' ? Math.floor(C / 2) - 1 : side === 'R' ? C - 1 : null;
                            const satisfied = (side === 'L' && pos.c < C / 2) || (side === 'R' && pos.c >= C / 2);
                            if (satisfied) { if (side) addConstraint(name, C_colRange(sc, ec)); continue; }
                            const cands = [];
                            for (let r = 0; r < R; r++) {
                                if (sc !== null) { for (let c = sc; c <= ec; c++) { if ((r !== pos.r || c !== pos.c) && passConstraints(name, r, c)) cands.push({ r, c }); } }
                                else { for (let c = 0; c < C; c++) { if (c !== pos.c && (r !== pos.r || c !== pos.c) && passConstraints(name, r, c)) cands.push({ r, c }); } }
                            }
                            const avail = this._tryCollectAvailable(cands, name, posMap, fixedSeats, protectedByRule3, protectedByDistance, constraintMap);
                            if (this._pickAndSwap(avail, pos.r, pos.c, posMap, protectedByDistance) && side) addConstraint(name, C_colRange(sc, ec));
                            continue;
                        }

                        // === 模式 'B'：斜角 (B name1 name2 [prob%]) 甲必在乙的斜对角4格之一 ===
                        if (modeId === 'B') {
                            if (rule.length !== 3 && rule.length !== 4) continue;
                            const n1 = rule[1], n2 = rule[2];
                            let probVal = rule.length === 4 ? parseInt(rule[3]) : 100;
                            if (n1 === n2 || isNaN(probVal) || probVal < 0 || probVal > 100 || rng() * 100 >= probVal) continue;
                            const p1 = posMap.get(n1), p2 = posMap.get(n2);
                            if (!p1 || !p2 || fixedSeats.has(n1)) continue;
                            const satisfied = (Math.abs(p1.r - p2.r) === 1 && Math.abs(p1.c - p2.c) === 1);
                            if (satisfied) { addPairConstraint(n1, n2, (x) => C_diag(x)); continue; }
                            const cands = [];
                            for (let rr = Math.max(0, p2.r - 1); rr <= Math.min(R - 1, p2.r + 1); rr++)
                                for (let cc = Math.max(0, p2.c - 1); cc <= Math.min(C - 1, p2.c + 1); cc++)
                                    if (Math.abs(rr - p2.r) === 1 && Math.abs(cc - p2.c) === 1 && passConstraints(n1, rr, cc))
                                        cands.push({ r: rr, c: cc });
                            const avail = this._tryCollectAvailable(cands, n1, posMap, fixedSeats, protectedByRule3, protectedByDistance, constraintMap);
                            if (this._pickAndSwap(avail, p1.r, p1.c, posMap, protectedByDistance)) addPairConstraint(n1, n2, (x) => C_diag(x));
                            continue;
                        }

                        // === 模式 '0' / '1'（只写两个名字）：必须同桌 ===
                        // 教室每两列一张课桌，过道在 列2|3、4|5、6|7 之间；
                        // 同桌 = 同一行且列号为 (1,2)(3,4)(5,6)(7,8) 之一（0 基即 c ^ 1）。
                        // 依次尝试：① 让甲坐到乙的同桌位 ② 让乙坐到甲的同桌位 ③ 另找一张空桌让两人一起搬过去
                        if ((modeId === '0' || modeId === '1') && rule.length === 3) {
                            const n1 = rule[1], n2 = rule[2];
                            if (n1 === n2) continue;
                            const p1 = posMap.get(n1), p2 = posMap.get(n2);
                            if (!p1 || !p2) continue;
                            if (p1.r === p2.r && (p1.c ^ 1) === p2.c) {
                                addPairConstraint(n1, n2, (x) => C_desk(x));
                                continue;
                            }
                            let done = false;
                            // ① / ② 谁方便谁坐过去（对方固定座位时只有一种选择）
                            const moveToMate = (mover, anchor) => {
                                if (fixedSeats.has(mover)) return false;
                                const pm = posMap.get(mover), pa = posMap.get(anchor);
                                const tr = pa.r, tc = pa.c ^ 1;
                                if (!passConstraints(mover, tr, tc)) return false;
                                const avail = this._tryCollectAvailable([{ r: tr, c: tc }], mover, posMap, fixedSeats, protectedByRule3, protectedByDistance, constraintMap);
                                return this._pickAndSwap(avail, pm.r, pm.c, posMap, protectedByDistance);
                            };
                            done = moveToMate(n1, n2) || moveToMate(n2, n1);
                            // ③ 两个同桌位都被占用时：随机找一张桌子，把两人一起搬过去
                            if (!done && !fixedSeats.has(n1) && !fixedSeats.has(n2)) {
                                const desks = [];
                                for (let r = 0; r < R; r++) for (let c = 0; c < C; c += 2) desks.push({ r, c });
                                for (let i = desks.length - 1; i > 0; i--) {
                                    const j = Math.floor(rng() * (i + 1));
                                    [desks[i], desks[j]] = [desks[j], desks[i]];
                                }
                                const canTake = (occ, a, b) => !occ || occ === ' ' || occ === a || occ === b ||
                                    (!protectedByRule3.has(occ) && !protectedByDistance.has(occ) && !constraintMap.has(occ) && !fixedSeats.has(occ));
                                for (const d of desks) {
                                    const s1 = { r: d.r, c: d.c }, s2 = { r: d.r, c: d.c + 1 };
                                    // 两种分配都试：甲左乙右 / 甲右乙左
                                    for (const [ma, ta, mb, tb] of [[n1, s1, n2, s2], [n1, s2, n2, s1]]) {
                                        if (!canTake(this.ans[ta.r][ta.c], ma, mb)) continue;
                                        if (!canTake(this.ans[tb.r][tb.c], ma, mb)) continue;
                                        if (!passConstraints(ma, ta.r, ta.c) || !passConstraints(mb, tb.r, tb.c)) continue;
                                        this._moveSeat(ma, ta, posMap);
                                        this._moveSeat(mb, tb, posMap);
                                        protectedByDistance.add(ma);
                                        protectedByDistance.add(mb);
                                        done = true;
                                        break;
                                    }
                                    if (done) break;
                                }
                            }
                            if (done) addPairConstraint(n1, n2, (x) => C_desk(x));
                            continue;
                        }

                        // === 模式 '1'：距离约束 (1 name1 name2 [prob%] | minDist maxDist [prob%]) ===
                        if (modeId === '1' || modeId === '0') {
                            if (rule.length !== 3 && rule.length !== 4 && rule.length !== 5 && rule.length !== 6) continue;
                            const n1 = rule[1], n2 = rule[2];
                            if (n1 === n2) continue;
                            let minD = modeId === '0' ? 2 : 1, maxD = modeId === '0' ? 99 : 2, probVal = 100;
                            if (rule.length === 4) probVal = parseInt(rule[3]);
                            else if (rule.length === 5) { minD = parseInt(rule[3]); maxD = parseInt(rule[4]); }
                            else if (rule.length === 6) { minD = parseInt(rule[3]); maxD = parseInt(rule[4]); probVal = parseInt(rule[5]); if (isNaN(minD)) minD = 1; if (isNaN(maxD)) maxD = 2; }
                            if (isNaN(minD) || isNaN(maxD) || minD < 0 || maxD > 99 || minD > maxD) continue;
                            if (isNaN(probVal) || probVal < 0 || probVal > 100 || rng() * 100 >= probVal) continue;
                            const p1 = posMap.get(n1), p2 = posMap.get(n2);
                            if (!p1 || !p2 || fixedSeats.has(n1)) continue;
                            const dist = Math.abs(p1.r - p2.r) + Math.abs(p1.c - p2.c);
                            const satisfied = dist >= minD && dist <= maxD;
                            if (satisfied) { addPairConstraint(n1, n2, (x) => C_dist(x, minD, maxD)); continue; }
                            const cands = [];
                            for (let r = 0; r < R; r++)
                                for (let c = 0; c < C; c++) {
                                    if (r === p2.r && c === p2.c) continue;
                                    const d = Math.abs(r - p2.r) + Math.abs(c - p2.c);
                                    if (d >= minD && d <= maxD && passConstraints(n1, r, c)) cands.push({ r, c });
                                }
                            const avail = this._tryCollectAvailable(cands, n1, posMap, fixedSeats, protectedByRule3, protectedByDistance, constraintMap);
                            if (this._pickAndSwap(avail, p1.r, p1.c, posMap, protectedByDistance)) addPairConstraint(n1, n2, (x) => C_dist(x, minD, maxD));
                            continue;
                        }
                    }
                }

                // ---------- 更新座位显示 ----------
                _updateSeatDisplay() {
                    for (let r = 0; r < 7; r++) {
                        for (let c = 0; c < 8; c++) {
                            const cell = this.seatCells[r][c];
                            cell.textContent = this.ans[r][c] || '';
                            cell.className = 'seat-cell ' + (r >= 1 && r <= 4 ? 'middle' : 'wall');
                            cell.title = `行${r + 1} 列${c + 1}: ${this.ans[r][c] || '(空)'}`;
                        }
                    }
                    this._updateButtonStates();
                }

                // ---------- 导出座位表 ----------
                _exportSeats() {
                    if (!this._hasValidSeats()) { alert('请先生成座位表！'); return; }
                    if (!this.exportMode) { alert('访客模式下无法导出。'); return; }
                    try {
                        let content = '座位表\n';
                        content += `生成时间: ${new Date().toLocaleString('zh-CN')}\n`;
                        content += '='.repeat(50) + '\n\n';
                        for (let r = 0; r < 7; r++) {
                            let rowParts = [];
                            for (let c = 0; c < 8; c++) rowParts.push(this.ans[r][c] || ' ');
                            content += rowParts.join('\t') + '\n';
                        }

                        // ★ 同时导出"座位历史缓存"：学校电脑有还原卡/重启丢缓存时，
                        //   下次点"读取缓存"选择本文件即可恢复反重复历史
                        content += '\n\n' + this._historyFileBlock() + '\n';

                        const blob = new Blob(['\ufeff' + content], { type: 'text/plain;charset=utf-8' });
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        const ts = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
                        a.download = `座位表_${ts}.txt`;
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        URL.revokeObjectURL(url);
                        this._log(`座位表已导出（含座位历史缓存）: ${a.download}`);
                        this._setStatus('导出成功', 'active');
                    } catch (e) {
                        this._log(`导出失败: ${e.message}`);
                        this._setStatus('导出失败', 'error');
                        alert(`导出失败: ${e.message}`);
                    }
                }

                // ---------- 刷新随机种子（使用 window.crypto.getRandomValues） ----------
                _testRandomness() {
                    try {
                        const seed = window.crypto.getRandomValues(new Uint32Array(1))[0];
                        this._log(`🎯 已刷新随机种子: ${seed} (crypto.getRandomValues)`);
                        if (!this.specialMode) {
                            localStorage.removeItem('iax_correct_rules_day');
                            this.correctRulesEnabled = true;
                            this.correctRulesApplyCount = 0;
                        }
                        this._setStatus('随机种子已刷新', 'active');
                    } catch (e) {
                        this._log(`刷新随机种子失败: ${e.message}`);
                        this._setStatus('刷新失败', 'error');
                    }
                }

                // ---------- 访客页面 ----------
                async _loadGuestPageInfo() {
                    try {
                        const txt = await this._fetchText(`${this.remoteBaseUrl}/page.txt`, 6000);
                        let line = null;
                        for (const l of txt.split(/\r?\n/)) {
                            const s = l.trim();
                            if (s) { line = s; break; }
                        }
                        if (!line) throw new Error('page.txt 内容为空');
                        let label, url;
                        const splitIdx = Math.max(line.lastIndexOf(' '), line.lastIndexOf('\t'));
                        if (splitIdx > 0) {
                            label = line.substring(0, splitIdx).trim().replace(/_/g, ' ');
                            url = line.substring(splitIdx + 1).trim();
                        } else {
                            label = '打开页面';
                            url = line.trim();
                        }
                        if (!url.startsWith('http://') && !url.startsWith('https://')) url = 'http://' + url;
                        this.guestPageUrl = url;
                        this.guestPageLabel = label;
                        this.guestPageBtnText.textContent = label;
                        this.guestPageBtn.disabled = false;
                        this.guestPageBtn.title = url;
                    } catch (e) {
                        this.guestPageUrl = null;
                        this.guestPageBtnText.textContent = '千万别点';
                        this.guestPageBtn.disabled = false;
                    }
                }

                _openGuestPage() {
                    if (this.guestPageUrl) {
                        window.open(this.guestPageUrl, '_blank', 'noopener,noreferrer');
                    } else {
                        this.guestPageBtn.disabled = true;
                        this.guestPageBtnText.textContent = '加载中...';
                        this._loadGuestPageInfo().then(() => {
                            if (this.guestPageUrl) window.open(this.guestPageUrl, '_blank', 'noopener,noreferrer');
                            else alert('无法加载访客页面');
                        });
                    }
                }
            }

            // ============ 启动应用 ============
            new SeatAllocatorApp();
            console.log('iAxiom Placement System hyper version - Web Edition');
            console.log('🔐 随机引擎: batch-256 crypto×时间熵 + 3轮 Fisher-Yates + uniqueRandomMatrix + 反重复修复(禁坐回最近4次座位/上次邻座)');
        })();
    </script>
