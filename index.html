<!DOCTYPE html>
<html lang="zh-CN"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iAxiom Placement System hyper version</title>
    <style>
        /* ============================================================
           iAxiom Placement System — Liquid Glass UI
           液态玻璃设计：彩色流动背景 + 毛玻璃面板 + 高光描边
           ============================================================ */
        :root {
            /* 玻璃质感令牌 */
            --glass-bg: rgba(255, 255, 255, 0.48);
            --glass-bg-soft: rgba(255, 255, 255, 0.30);
            --glass-bg-strong: rgba(255, 255, 255, 0.66);
            --glass-border: rgba(255, 255, 255, 0.70);
            --glass-highlight: rgba(255, 255, 255, 0.95);
            --glass-inner: inset 0 1px 0 rgba(255, 255, 255, 0.85), inset 0 -1px 0 rgba(255, 255, 255, 0.30);
            --glass-shadow: 0 22px 60px rgba(38, 45, 118, 0.20), 0 8px 22px rgba(38, 45, 118, 0.10);
            --glass-shadow-sm: 0 6px 18px rgba(38, 45, 118, 0.12);
            --blur: 26px;
            --blur-soft: 14px;

            /* 文本与强调色 */
            --text-primary: #141a33;
            --text-secondary: #4a5270;
            --text-tertiary: #7b84a3;
            --accent: #5b6cff;
            --accent-hover: #4a5bf0;
            --accent-press: #3b49d6;
            --accent-soft: rgba(91, 108, 255, 0.16);
            --tint-a: #6d8bff;
            --tint-b: #22b8cf;

            /* 兼容旧变量名（部分内联样式引用） */
            --bg-primary: #eef1ff;
            --bg-secondary: rgba(255, 255, 255, 0.5);
            --bg-card: rgba(255, 255, 255, 0.55);
            --bg-card-hover: rgba(255, 255, 255, 0.78);
            --bg-canvas: rgba(255, 255, 255, 0.28);
            --accent-light: rgba(91, 108, 255, 0.14);
            --border: rgba(255, 255, 255, 0.60);
            --border-strong: rgba(120, 132, 180, 0.35);
            --shadow-sm: 0 3px 10px rgba(38, 45, 118, 0.10);
            --shadow-md: 0 8px 22px rgba(38, 45, 118, 0.14);
            --shadow-lg: 0 14px 40px rgba(38, 45, 118, 0.18);
            --shadow-xl: var(--glass-shadow);
            --bg-mica: var(--glass-bg);
            --blur-mica: var(--blur);
            --bg-acrylic: var(--glass-bg-soft);
            --blur-acrylic: var(--blur-soft);

            /* 圆角与动效 */
            --radius-sm: 10px;
            --radius-md: 14px;
            --radius-lg: 20px;
            --radius-xl: 30px;
            --font-family: 'Segoe UI Variable', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', system-ui, -apple-system, sans-serif;
            --transition-fast: 0.16s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-normal: 0.26s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-slow: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --glass-bg: rgba(24, 28, 52, 0.55);
                --glass-bg-soft: rgba(22, 26, 48, 0.38);
                --glass-bg-strong: rgba(30, 35, 64, 0.72);
                --glass-border: rgba(255, 255, 255, 0.16);
                --glass-highlight: rgba(255, 255, 255, 0.28);
                --glass-inner: inset 0 1px 0 rgba(255, 255, 255, 0.18), inset 0 -1px 0 rgba(0, 0, 0, 0.25);
                --glass-shadow: 0 22px 60px rgba(0, 0, 0, 0.55), 0 8px 22px rgba(0, 0, 0, 0.35);
                --glass-shadow-sm: 0 6px 18px rgba(0, 0, 0, 0.35);

                --text-primary: #eef1ff;
                --text-secondary: #b9c0e0;
                --text-tertiary: #8b93b8;
                --accent: #8ea2ff;
                --accent-hover: #a3b3ff;
                --accent-press: #7b8ef0;
                --accent-soft: rgba(142, 162, 255, 0.20);

                --bg-primary: #080b1a;
                --bg-secondary: rgba(255, 255, 255, 0.06);
                --bg-card: rgba(255, 255, 255, 0.07);
                --bg-card-hover: rgba(255, 255, 255, 0.13);
                --bg-canvas: rgba(255, 255, 255, 0.04);
                --accent-light: rgba(142, 162, 255, 0.16);
                --border: rgba(255, 255, 255, 0.14);
                --border-strong: rgba(255, 255, 255, 0.22);
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 15px;
            scroll-behavior: smooth;
        }

        /* ---------- 液态背景：缓慢流动的彩色光斑 ---------- */
        body {
            font-family: var(--font-family);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            position: relative;
            overflow-x: hidden;
            background: linear-gradient(135deg, #eef2ff 0%, #f6ecff 35%, #e6f7ff 70%, #eaf0ff 100%);
            transition: background var(--transition-slow);
        }
        body::before,
        body::after {
            content: '';
            position: fixed;
            z-index: 0;
            border-radius: 50%;
            filter: blur(70px);
            opacity: 0.75;
            pointer-events: none;
            will-change: transform;
        }
        body::before {
            width: 46vw;
            height: 46vw;
            top: -12vw;
            left: -10vw;
            background: radial-gradient(circle at 30% 30%, #7f9cff 0%, rgba(127, 156, 255, 0) 70%),
                        radial-gradient(circle at 70% 70%, #b98cff 0%, rgba(185, 140, 255, 0) 70%);
            animation: liquidDrift 26s ease-in-out infinite alternate;
        }
        body::after {
            width: 52vw;
            height: 52vw;
            bottom: -16vw;
            right: -12vw;
            background: radial-gradient(circle at 40% 40%, #6ee7f0 0%, rgba(110, 231, 240, 0) 70%),
                        radial-gradient(circle at 60% 60%, #9d8cff 0%, rgba(157, 140, 255, 0) 70%);
            animation: liquidDrift 34s ease-in-out infinite alternate-reverse;
        }
        @media (prefers-color-scheme: dark) {
            body {
                background: linear-gradient(135deg, #070a18 0%, #0d0a24 40%, #061622 70%, #080b1a 100%);
            }
            body::before { opacity: 0.45; }
            body::after { opacity: 0.40; }
        }
        @keyframes liquidDrift {
            0%   { transform: translate3d(0, 0, 0) scale(1); }
            50%  { transform: translate3d(4vw, 3vh, 0) scale(1.12); }
            100% { transform: translate3d(-3vw, 5vh, 0) scale(1.04); }
        }

        /* ---------- 主容器（主玻璃面板） ---------- */
        .app-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 1100px;
            min-width: 820px;
            background-color: var(--glass-bg);
            background-image: linear-gradient(150deg, rgba(255, 255, 255, 0.55) 0%, rgba(255, 255, 255, 0.12) 42%, rgba(255, 255, 255, 0.30) 100%);
            backdrop-filter: blur(var(--blur)) saturate(180%);
            -webkit-backdrop-filter: blur(var(--blur)) saturate(180%);
            border-radius: var(--radius-xl);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow), var(--glass-inner);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            max-height: 95vh;
            transition: all var(--transition-normal);
        }
        @media (prefers-color-scheme: dark) {
            .app-container {
                background-image: linear-gradient(150deg, rgba(255, 255, 255, 0.10) 0%, rgba(255, 255, 255, 0.02) 45%, rgba(255, 255, 255, 0.06) 100%);
            }
        }

        .app-content {
            display: flex;
            flex-direction: column;
            height: 100%;
            max-height: 95vh;
        }

        /* ---------- 标题栏 ---------- */
        .title-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.42), rgba(255, 255, 255, 0.12));
            flex-shrink: 0;
            gap: 16px;
            flex-wrap: wrap;
        }
        @media (prefers-color-scheme: dark) {
            .title-bar { background: linear-gradient(180deg, rgba(255, 255, 255, 0.10), rgba(255, 255, 255, 0.02)); }
        }
        .title-bar-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .app-icon {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            background: linear-gradient(140deg, #7c8cff 0%, #4fd1e0 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #fff;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(91, 108, 255, 0.38), inset 0 1px 0 rgba(255, 255, 255, 0.65);
        }
        .app-icon::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(115deg, rgba(255, 255, 255, 0.85) 0%, rgba(255, 255, 255, 0) 45%);
            transform: translateX(-60%);
            animation: sheen 5.5s ease-in-out infinite;
        }
        @keyframes sheen {
            0%, 55% { transform: translateX(-70%); }
            85%, 100% { transform: translateX(75%); }
        }
        .app-title {
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            color: var(--text-primary);
            white-space: nowrap;
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.35);
        }
        @media (prefers-color-scheme: dark) {
            .app-title { text-shadow: none; }
        }
        .app-version {
            font-size: 0.78rem;
            color: var(--text-secondary);
            font-weight: 600;
            background: var(--glass-bg-soft);
            padding: 4px 11px;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            white-space: nowrap;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.4);
        }
        .title-bar-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* ---------- 模式徽章 ---------- */
        .mode-badge {
            font-size: 0.75rem;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 20px;
            letter-spacing: 0.02em;
            white-space: nowrap;
            transition: all var(--transition-fast);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.5), var(--glass-shadow-sm);
        }
        .mode-badge.normal {
            background: linear-gradient(140deg, rgba(74, 222, 128, 0.34), rgba(34, 197, 94, 0.20));
            color: #10723c;
        }
        .mode-badge.special {
            background: linear-gradient(140deg, rgba(251, 191, 36, 0.38), rgba(249, 115, 22, 0.22));
            color: #92400e;
        }
        .mode-badge.guest {
            background: linear-gradient(140deg, rgba(196, 132, 252, 0.36), rgba(139, 92, 246, 0.22));
            color: #6b21a8;
        }
        @media (prefers-color-scheme: dark) {
            .mode-badge.normal { color: #86efac; }
            .mode-badge.special { color: #fcd34d; }
            .mode-badge.guest { color: #d8b4fe; }
        }

        /* ---------- 主体布局 ---------- */
        .main-body {
            display: flex;
            flex: 1;
            overflow: hidden;
            min-height: 0;
        }

        /* ---------- 侧边栏 ---------- */
        .sidebar {
            width: 232px;
            min-width: 214px;
            padding: 16px;
            border-right: 1px solid var(--border);
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.30), rgba(255, 255, 255, 0.08));
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex-shrink: 0;
            overflow-y: auto;
        }
        @media (prefers-color-scheme: dark) {
            .sidebar { background: linear-gradient(180deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.02)); }
        }
        .sidebar-section {
            margin-bottom: 8px;
        }
        .sidebar-label {
            display: block;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.07em;
            color: var(--text-tertiary);
            font-weight: 700;
            margin-bottom: 7px;
            padding-left: 3px;
        }
        .sidebar button {
            width: 100%;
            padding: 11px 14px;
            border-radius: 14px;
            border: 1px solid var(--glass-border);
            background-color: var(--glass-bg-soft);
            background-image: linear-gradient(150deg, rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0.10));
            color: var(--text-primary);
            cursor: pointer;
            font-size: 0.88rem;
            font-family: var(--font-family);
            font-weight: 600;
            text-align: left;
            transition: all var(--transition-fast);
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.55), var(--glass-shadow-sm);
            position: relative;
            overflow: hidden;
        }
        @media (prefers-color-scheme: dark) {
            .sidebar button {
                background-image: linear-gradient(150deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.03));
            }
        }
        .sidebar button::after {
            content: '';
            position: absolute;
            top: 0;
            left: -60%;
            width: 45%;
            height: 100%;
            background: linear-gradient(100deg, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.55) 50%, rgba(255, 255, 255, 0) 100%);
            transform: skewX(-18deg);
            opacity: 0;
            transition: opacity var(--transition-fast);
            pointer-events: none;
        }
        .sidebar button:hover:not(:disabled) {
            background-color: var(--bg-card-hover);
            border-color: var(--glass-highlight);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7), 0 12px 26px rgba(38, 45, 118, 0.18);
            transform: translateY(-2px);
        }
        .sidebar button:hover:not(:disabled)::after {
            opacity: 1;
            animation: sweep 0.85s ease-out;
        }
        @keyframes sweep {
            from { left: -60%; }
            to { left: 115%; }
        }
        .sidebar button:active:not(:disabled) {
            transform: translateY(0) scale(0.985);
            box-shadow: inset 0 2px 6px rgba(38, 45, 118, 0.18);
            transition: all 0.06s;
        }
        .sidebar button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            filter: saturate(60%);
        }
        .sidebar button .btn-icon {
            font-size: 1.1rem;
            flex-shrink: 0;
        }
        .sidebar .btn-accent {
            background-color: transparent;
            background-image: linear-gradient(140deg, #6d7dff 0%, #7c5cff 45%, #38bdf8 100%);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.45);
            font-weight: 700;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.55), 0 10px 26px rgba(91, 108, 255, 0.42);
            text-shadow: 0 1px 2px rgba(20, 24, 60, 0.25);
        }
        .sidebar .btn-accent:hover:not(:disabled) {
            background-image: linear-gradient(140deg, #7d8bff 0%, #8b6bff 45%, #4ac9ff 100%);
            border-color: rgba(255, 255, 255, 0.6);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.65), 0 14px 32px rgba(91, 108, 255, 0.55);
        }
        .sidebar .btn-accent:active:not(:disabled) {
            background-image: linear-gradient(140deg, #5b6cf0 0%, #6b4ce8 45%, #22a8dd 100%);
        }

        /* ---------- 状态指示 ---------- */
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 11px 13px;
            border-radius: 14px;
            background: var(--glass-bg-soft);
            border: 1px solid var(--glass-border);
            font-size: 0.82rem;
            color: var(--text-secondary);
            min-height: 42px;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.45), var(--glass-shadow-sm);
        }
        .status-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            flex-shrink: 0;
            background: #9aa3c0;
            transition: background var(--transition-normal);
        }
        .status-dot.active {
            background: #34d399;
            box-shadow: 0 0 10px rgba(52, 211, 153, 0.75);
        }
        .status-dot.busy {
            background: #fbbf24;
            animation: pulse-dot 0.9s ease-in-out infinite;
            box-shadow: 0 0 10px rgba(251, 191, 36, 0.75);
        }
        .status-dot.error {
            background: #f87171;
            box-shadow: 0 0 10px rgba(248, 113, 113, 0.75);
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.55; transform: scale(1.55); }
        }

        /* ---------- 座位区 ---------- */
        .seat-area {
            flex: 1;
            padding: 16px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-width: 0;
        }
        .seat-area-header {
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--text-tertiary);
            text-transform: uppercase;
            letter-spacing: 0.07em;
            margin-bottom: 10px;
            flex-shrink: 0;
        }
        .seat-scroll-wrapper {
            flex: 1;
            overflow: auto;
            border-radius: var(--radius-lg);
            background-color: var(--bg-canvas);
            background-image: linear-gradient(150deg, rgba(255, 255, 255, 0.34), rgba(255, 255, 255, 0.06));
            border: 1px solid var(--glass-border);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.5), var(--glass-shadow-sm);
            padding: 14px;
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }
        @media (prefers-color-scheme: dark) {
            .seat-scroll-wrapper {
                background-image: linear-gradient(150deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.02));
            }
        }
        .seat-grid-outer {
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: stretch;
        }
        .seat-grid {
            display: grid;
            grid-template-columns: repeat(8, 78px);
            grid-template-rows: repeat(7, 48px);
            gap: 4px;
            flex-shrink: 0;
        }
        .seat-cell {
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            font-size: 0.82rem;
            font-weight: 600;
            color: #fff;
            text-align: center;
            cursor: default;
            transition: transform var(--transition-fast), box-shadow var(--transition-fast), filter var(--transition-fast);
            position: relative;
            overflow: hidden;
            word-break: break-all;
            padding: 2px 4px;
            line-height: 1.2;
            min-width: 0;
            letter-spacing: 0.01em;
            border: 1px solid rgba(255, 255, 255, 0.32);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.45), 0 4px 12px rgba(38, 45, 118, 0.18);
            text-shadow: 0 1px 2px rgba(20, 24, 60, 0.28);
        }
        .seat-cell::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(160deg, rgba(255, 255, 255, 0.42) 0%, rgba(255, 255, 255, 0.04) 48%, rgba(255, 255, 255, 0) 100%);
            pointer-events: none;
        }
        .seat-cell.middle {
            background-image: linear-gradient(145deg, rgba(109, 125, 255, 0.95) 0%, rgba(139, 108, 255, 0.88) 100%);
        }
        .seat-cell.wall {
            background-image: linear-gradient(145deg, rgba(34, 184, 207, 0.95) 0%, rgba(59, 130, 246, 0.88) 100%);
        }
        .seat-cell:hover {
            transform: translateY(-2px) scale(1.07);
            z-index: 5;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.6), 0 12px 26px rgba(38, 45, 118, 0.35);
            filter: brightness(1.06) saturate(115%);
        }
        @media (prefers-color-scheme: dark) {
            .seat-cell.middle {
                background-image: linear-gradient(145deg, rgba(88, 102, 214, 0.92) 0%, rgba(112, 86, 214, 0.86) 100%);
            }
            .seat-cell.wall {
                background-image: linear-gradient(145deg, rgba(26, 146, 168, 0.92) 0%, rgba(45, 104, 200, 0.86) 100%);
            }
        }
        .area-labels {
            display: grid;
            grid-template-columns: repeat(8, 78px);
            gap: 4px;
            flex-shrink: 0;
            font-size: 0.75rem;
            font-weight: 700;
            color: #fff;
        }
        .col-label {
            padding: 6px 4px;
            border-radius: 10px;
            text-align: center;
            white-space: nowrap;
            letter-spacing: 0.03em;
            font-size: 0.7rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.30);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.45), 0 3px 10px rgba(38, 45, 118, 0.16);
            text-shadow: 0 1px 2px rgba(20, 24, 60, 0.25);
        }
        .col-label-a {
            background-image: linear-gradient(145deg, rgba(34, 184, 207, 0.92), rgba(56, 189, 248, 0.85));
        }
        .col-label-b {
            background-image: linear-gradient(145deg, rgba(109, 125, 255, 0.92), rgba(139, 108, 255, 0.85));
        }

        /* ---------- 日志区 ---------- */
        .log-area {
            border-top: 1px solid var(--border);
            padding: 12px 16px;
            flex-shrink: 0;
            background: linear-gradient(0deg, rgba(255, 255, 255, 0.34), rgba(255, 255, 255, 0.08));
        }
        @media (prefers-color-scheme: dark) {
            .log-area { background: linear-gradient(0deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.02)); }
        }
        .log-header {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.07em;
            color: var(--text-tertiary);
            font-weight: 700;
            margin-bottom: 6px;
        }
        .log-scroll {
            max-height: 120px;
            overflow-y: auto;
            background: var(--glass-bg-soft);
            border-radius: 14px;
            border: 1px solid var(--glass-border);
            padding: 9px 13px;
            font-family: 'Cascadia Code', 'Fira Code', 'JetBrains Mono', 'Consolas', 'Monaco', monospace;
            font-size: 0.78rem;
            color: var(--text-secondary);
            line-height: 1.55;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.4);
        }
        .log-entry {
            padding: 1px 0;
            border-radius: 6px;
            transition: background var(--transition-fast);
        }

    <script>
        (function() {
            // ============ 常量定义 ============
            const BUILTIN_NORMAL_PASSWORD = "adanceoffireandice";
            const BUILTIN_SPECIAL_PASSWORD = "aadanceoffireandice";
            const GUEST_PASSWORD = "1234567";
            const REMOTE_HOST = "infplace.gorsu.ch";
            const REMOTE_PATH = "/";
            const REMOTE_ORIGIN = `https://${REMOTE_HOST}`;
            const REMOTE_BASE_URL = `${REMOTE_ORIGIN}${REMOTE_PATH}`;

            // ============ 工具函数 ============
            function getRemoteBaseUrl() {
                if (typeof location === 'undefined') return REMOTE_BASE_URL;
                if (location.protocol === 'http:' || location.protocol === 'https:') {
                    if (location.hostname === REMOTE_HOST) {
                        return `${location.protocol}//${location.host}${REMOTE_PATH}`;
                    }
                }
                return REMOTE_BASE_URL;
            }

            function getTimeStr() {
                const d = new Date();
                return d.getHours().toString().padStart(2, '0') + ':' +
                    d.getMinutes().toString().padStart(2, '0') + ':' +
                    d.getSeconds().toString().padStart(2, '0');
            }

            function getWeekEnd() {
                const now = new Date();
                const day = now.getDay();
                const daysUntilSunday = (7 - day) % 7;
                const sunday = new Date(now.getFullYear(), now.getMonth(), now.getDate() + daysUntilSunday);
                sunday.setHours(23, 59, 59, 999);
                return sunday.getTime();
            }

            /**
             * 使用 window.crypto.getRandomValues 生成高随机性的 [0, 1) 浮点数
             * 核心：window.crypto.getRandomValues(new Uint32Array(1))[0] 获取一个32位无符号整数
             * 除以 0x100000000 (即 2^32 = 4294967296) 得到 [0, 1) 范围的均匀分布随机数
             * 若浏览器不支持/禁用了 crypto，则回退到"时间 + 调用计数"混合的 PRNG，绝不返回固定序列
             */
            let __rngFallbackState = ((Date.now() & 0xffffffff) ^ 0x9E3779B9) >>> 0;
            let __rngFallbackCalls = 0;

            function __fallbackRandom() {
                __rngFallbackCalls = (__rngFallbackCalls + 1) >>> 0;
                __rngFallbackState = (__rngFallbackState + 0x6D2B79F5 + __rngFallbackCalls) >>> 0;
                let t = __rngFallbackState;
                t = Math.imul(t ^ t >>> 15, 1 | t);
                t = (t + Math.imul(t ^ t >>> 7, 61 | t)) ^ t;
                return ((t ^ t >>> 14) >>> 0) / 4294967296;
            }

            function __cryptoObj() {
                return (typeof window !== 'undefined' && (window.crypto || window.msCrypto)) || null;
            }

            function cryptoRandom() {
                try {
                    const c = __cryptoObj();
                    if (c && c.getRandomValues) return c.getRandomValues(new Uint32Array(1))[0] / 0x100000000;
                } catch (e) { /* 落到兜底 */ }
                return __fallbackRandom();
            }

            /**
             * 使用 window.crypto.getRandomValues 获取高随机性种子
             * 返回一个32位无符号整数作为随机种子
             */
            function getStrongSeed() {
                try {
                    const c = __cryptoObj();
                    if (c && c.getRandomValues) return c.getRandomValues(new Uint32Array(1))[0];
                } catch (e) { /* 落到兜底 */ }
                return Math.floor(__fallbackRandom() * 0x100000000) >>> 0;
            }

            /**
             * 填充熵池：crypto 随机值 与 时间熵 逐元素 XOR 混合
             * （XOR 常量为双射，不会削弱 crypto 的熵；若 crypto 异常返回固定值，时间熵可兜底产生变化）
             */
            function fillEntropyPool(pool) {
                const now = Date.now();
                const perf = (typeof performance !== 'undefined' && performance.now) ? Math.floor(performance.now() * 1000) : now;
                const mix = ((now ^ perf) >>> 0);
                try {
                    const c = __cryptoObj();
                    if (c && c.getRandomValues) {
                        c.getRandomValues(pool);
                        for (let i = 0; i < pool.length; i++) {
                            pool[i] = (pool[i] ^ mix ^ Math.imul(i + 1, 0x9E3779B9)) >>> 0;
                        }
                        return;
                    }
                } catch (e) { /* 落到兜底 */ }
                for (let i = 0; i < pool.length; i++) {
                    pool[i] = Math.floor(__fallbackRandom() * 0x100000000) >>> 0;
                }
            }

            // mulberry32 确定性伪随机数生成器（保留用于需要可重现序列的场景）
            function mulberry32(a) {
                return function() {
                    a |= 0;
                    a = a + 0x6D2B79F5 | 0;
                    let t = Math.imul(a ^ a >>> 15, 1 | a);
                    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
                    return ((t ^ t >>> 14) >>> 0) / 4294967296;
                };
            }

            /**
             * 生成不重复整数的随机矩阵
             * @param {number} rows - 行数
             * @param {number} cols - 列数
             * @param {number} low - 整数范围下界（包含）
             * @param {number} high - 整数范围上界（不包含），可选
             * @param {number|function} seedOrRng - 种子数字、随机数生成器函数，或 undefined
             *   - 如果是函数：直接用作随机数生成器（如 cryptoRandom）
             *   - 如果是数字：使用 mulberry32(seed) 作为随机数生成器
             *   - 如果是 undefined：使用 Math.random
             */
            function uniqueRandomMatrix(rows, cols, low, high, seedOrRng) {
                const size = rows * cols;
                if (high === undefined || high === null) {
                    high = low + size;
                }
                if (high - low < size) {
                    throw new Error(`整数范围 [${low}, ${high}) 内只有 ${high - low} 个不同整数，无法填充 ${size} 个位置`);
                }
                const arr = [];
                for (let i = low; i < high; i++) arr.push(i);
                // 选择合适的随机数生成器
                let rng;
                if (typeof seedOrRng === 'function') {
                    rng = seedOrRng; // 直接使用传入的随机函数（如 cryptoRandom）
                } else if (seedOrRng !== undefined) {
                    rng = mulberry32(seedOrRng); // 使用确定性种子
                } else {
                    rng = Math.random; // 回退到 Math.random
                }
                // Fisher-Yates 洗牌
                for (let i = arr.length - 1; i > 0; i--) {
                    const j = Math.floor(rng() * (i + 1));
                    [arr[i], arr[j]] = [arr[j], arr[i]];
                }
                const selected = arr.slice(0, size);
                const matrix = [];
                let idx = 0;
                for (let r = 0; r < rows; r++) {
                    const row = [];
                    for (let c = 0; c < cols; c++) {
                        row.push(selected[idx++]);
                    }
                    matrix.push(row);
                }
                return matrix;
            }

            // ============ 反重复随机（避免每周坐回原位/邻座） ============
            const SEAT_HISTORY_KEY = 'iax_seat_history';   // 历次抽座记录（localStorage）
            const SEAT_HISTORY_MAX = 12;                   // 最多保留的历史记录条数
            // 座位历史随"导出座位表"一起写进 txt（应对还原卡/换电脑导致浏览器缓存丢失）
            const HISTORY_FILE_BEGIN = '=== iAxiom 座位历史缓存 开始（本段供程序读取，请勿修改或删除） ===';
            const HISTORY_FILE_END = '=== iAxiom 座位历史缓存 结束 ===';
            const ANTI_REPEAT = {
                exactDraws: 4,      // 禁止坐回"最近 N 次抽座"中完全相同的座位
                nearRadius: 1,      // 上次座位周围一圈（|Δ行|≤1 且 |Δ列|≤1）尽量避免
                maxIterations: 8000, // 修复迭代上限
                partnerTries: 60    // 每次尝试交换的候选人数
            };

            // ============ 主应用类 ============
            class SeatAllocatorApp {
                constructor() {
                    this.version = "999";
                    this.ans = [];
                    for (let r = 0; r < 7; r++) {
                        this.ans.push(new Array(8).fill(" "));
                    }
                    this.students = [];
                    this.rules = [];
                    this.downloading = false;
                    this.correctRulesEnabled = false;
                    this.specialMode = false;
                    this.correctRulesApplyCount = 0;
                    this.exportMode = true;
                    this.visitorMode = false;
                    this.guestPageUrl = null;
                    this.guestPageLabel = null;
                    this.normalPassword = BUILTIN_NORMAL_PASSWORD;
                    this.specialPassword = BUILTIN_SPECIAL_PASSWORD;
                    this.passwordFetchFailed = false;
                    this.remoteBaseUrl = getRemoteBaseUrl();
                    this.isFileOrigin = (typeof location !== 'undefined' && location.protocol === 'file:');

                    // DOM 元素引用
                    this.appContainer = document.getElementById('appContainer');
                    this.passwordModal = document.getElementById('passwordModal');
                    this.passwordInput = document.getElementById('passwordInput');
                    this.passwordSubmitBtn = document.getElementById('passwordSubmitBtn');
                    this.passwordCancelBtn = document.getElementById('passwordCancelBtn');
                    this.passwordError = document.getElementById('passwordError');
                    this.passwordPrompt = document.getElementById('passwordPrompt');
                    this.seatGrid = document.getElementById('seatGrid');
                    this.logScroll = document.getElementById('logScroll');
                    this.statusDot = document.getElementById('statusDot');
                    this.statusText = document.getElementById('statusText');
                    this.modeBadge = document.getElementById('modeBadge');
                    this.downloadBtn = document.getElementById('downloadBtn');
                    this.generateBtn = document.getElementById('generateBtn');
                    this.exportBtn = document.getElementById('exportBtn');
                    this.refreshSeedBtn = document.getElementById('refreshSeedBtn');
                    this.loadHistoryBtn = document.getElementById('loadHistoryBtn');
                    this.clearHistoryBtn = document.getElementById('clearHistoryBtn');
                    this.historyFileInput = document.getElementById('historyFileInput');
                    this.guestPageBtn = document.getElementById('guestPageBtn');
                    this.guestPageBtnText = document.getElementById('guestPageBtnText');
                    this.guestPageSection = document.getElementById('guestPageSection');

                    this._initSeatGrid();
                    this._bindEvents();
                    // 直接启动密码验证流程
                    this.initPasswordFlow();
                }

                // ---------- 初始化座位网格 DOM ----------
                _initSeatGrid() {
                    this.seatGrid.innerHTML = '';
                    this.seatCells = [];
                    for (let r = 0; r < 7; r++) {
                        this.seatCells.push([]);
                        for (let c = 0; c < 8; c++) {
                            const cell = document.createElement('div');
                            cell.className = 'seat-cell ' + (r >= 1 && r <= 4 ? 'middle' : 'wall');
                            cell.textContent = '';
                            cell.title = `行${r + 1} 列${c + 1}`;
                            this.seatGrid.appendChild(cell);
                            this.seatCells[r].push(cell);
                        }
                    }
                }

                // ---------- 事件绑定 ----------
                _bindEvents() {
                    this.passwordSubmitBtn.addEventListener('click', () => this._handlePasswordSubmit());
                    this.passwordInput.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter') this._handlePasswordSubmit();
                    });
                    this.passwordCancelBtn.addEventListener('click', () => this._handlePasswordCancel());
                    this.downloadBtn.addEventListener('click', () => this._handleDownload());
                    this.generateBtn.addEventListener('click', () => this._generateSeats());
                    this.exportBtn.addEventListener('click', () => this._exportSeats());
                    this.refreshSeedBtn.addEventListener('click', () => this._testRandomness());
                    this.loadHistoryBtn.addEventListener('click', () => this._handleLoadHistoryClick());
                    this.clearHistoryBtn.addEventListener('click', () => this._handleClearHistoryClick());
                    this.historyFileInput.addEventListener('change', (e) => this._onHistoryFileChosen(e));
                    this.guestPageBtn.addEventListener('click', () => this._openGuestPage());
                }

                // ---------- 日志记录 ----------
                _log(message) {
                    const entry = document.createElement('div');
                    entry.className = 'log-entry';
                    entry.innerHTML = `<span class="log-time">[${getTimeStr()}]</span> ${this._escapeHtml(message)}`;
                    this.logScroll.appendChild(entry);
                    this.logScroll.scrollTop = this.logScroll.scrollHeight;
                }

                _escapeHtml(str) {
                    const div = document.createElement('div');
                    div.textContent = str;
                    return div.innerHTML;
                }

                // ---------- 状态指示 ----------
                _setStatus(text, type = 'idle') {
                    this.statusText.textContent = text;
                    this.statusDot.className = 'status-dot';
                    if (type === 'active') this.statusDot.classList.add('active');
                    if (type === 'busy') this.statusDot.classList.add('busy');
                    if (type === 'error') this.statusDot.classList.add('error');
                }

                // ---------- 文件读取 ----------
                async _readFileAsText(file) {
                    return await new Promise((resolve, reject) => {
                        const reader = new FileReader();
                        reader.onerror = () => reject(new Error('读取文件失败'));
                        reader.onload = () => resolve((reader.result || '').toString());
                        reader.readAsText(file);
                    });
                }

                async _importLocalFiles() {
                    const input = document.createElement('input');
                    input.type = 'file';
                    input.accept = '.txt,text/plain';
                    input.multiple = true;
                    input.style.display = 'none';
                    document.body.appendChild(input);

                    const files = await new Promise((resolve) => {
                        input.addEventListener('change', () => resolve(Array.from(input.files || [])), { once: true });
                        input.click();
                    });

                    document.body.removeChild(input);

                    if (!files.length) throw new Error('未选择文件');

                    const byName = new Map(files.map(f => [f.name.toLowerCase(), f]));
                    const studentsFile =
                        byName.get('students.txt') ||
                        files.find(f => f.name.toLowerCase().includes('students')) ||
                        files.find(f => f.name.includes('名单')) ||
                        null;
                    const rulesFile =
                        byName.get('rules.txt') ||
                        files.find(f => f.name.toLowerCase().includes('rules')) ||
                        files.find(f => f.name.includes('规则')) ||
                        null;
                    const passwordFile =
                        byName.get('password.txt') ||
                        files.find(f => f.name.toLowerCase().includes('password')) ||
                        null;
                    const pageFile =
                        byName.get('page.txt') ||
                        files.find(f => f.name.toLowerCase().includes('page')) ||
                        null;

                    if (passwordFile) {
                        try {
                            const passwordText = (await this._readFileAsText(passwordFile)).replace(/^\ufeff/, '');
                            const lines = passwordText.trim().split(/\r?\n/).map(s => s.trim()).filter(Boolean);
                            if (lines.length >= 2) {
                                this.normalPassword = lines[0];
                                this.specialPassword = lines[1];
                                this.passwordFetchFailed = false;
                                this._log('已从本地导入 password.txt');
                            }
                        } catch (e) { /* 静默处理 */ }
                    }

                    if (!studentsFile || !rulesFile) {
                        throw new Error('请同时选择 students.txt 与 rules.txt（可选：password.txt / page.txt）');
                    }

                    const studentsText = (await this._readFileAsText(studentsFile)).replace(/^\ufeff/, '');
                    let firstLine = null;
                    for (const line of studentsText.split(/\r?\n/)) {
                        const s = line.trim().replace(/^\ufeff/, '');
                        if (s) { firstLine = s; break; }
                    }
                    if (!firstLine) throw new Error('students.txt 内容为空或格式不正确');
                    this.students = firstLine.split(/\s+/).filter(s => s.length > 0);

                    const rulesText = (await this._readFileAsText(rulesFile)).replace(/^\ufeff/, '');
                    const rules = [];
                    for (const line of rulesText.split(/\r?\n/)) {
                        const s = line.trim().replace(/^\ufeff/, '');
                        if (!s) continue;
                        const parts = s.split(/\s+/);
                        if (parts.length >= 3 && parts.length <= 7) {
                            rules.push(parts);
                        }
                    }
                    this.rules = rules;

                    if (pageFile) {
                        try {
                            const pageText = (await this._readFileAsText(pageFile)).replace(/^\ufeff/, '');
                            let line = null;
                            for (const l of pageText.split(/\r?\n/)) {
                                const s = l.trim();
                                if (s) { line = s; break; }
                            }
                            if (line) {
                                let label, url;
                                const splitIdx = Math.max(line.lastIndexOf(' '), line.lastIndexOf('\t'));
                                if (splitIdx > 0) {
                                    label = line.substring(0, splitIdx).trim().replace(/_/g, ' ');
                                    url = line.substring(splitIdx + 1).trim();
                                } else {
                                    label = '打开页面';
                                    url = line.trim();
                                }
                                if (!url.startsWith('http://') && !url.startsWith('https://')) url = 'http://' + url;
                                this.guestPageUrl = url;
                                this.guestPageLabel = label;
                                this.guestPageBtnText.textContent = label;
                                this.guestPageBtn.disabled = false;
                                this.guestPageBtn.title = url;
                                this._log('已从本地导入 page.txt');
                            }
                        } catch (e) { /* 静默处理 */ }
                    }

                    try {
                        localStorage.setItem('iax_students', JSON.stringify(this.students));
                        localStorage.setItem('iax_rules', JSON.stringify(this.rules));
                    } catch (e) { /* 静默处理 */ }

                    this._log(`本地导入完成：${this.students.length} 名学生`);
                    this._setStatus('本地导入完成', 'active');
                    this._updateButtonStates();
                }

                // ---------- 密码流程 ----------
                async initPasswordFlow() {
                    this._setStatus('正在连接服务器获取密码...', 'busy');
                    try {
                        if (this.isFileOrigin) {
                            throw new Error('当前以本地文件方式打开（Origin: null），服务器会返回 500');
                        }
                        const resp = await this._fetchWithTimeout(`${this.remoteBaseUrl}/password.txt`, { timeout: 6000 });
                        const text = resp.trim().split(/\r?\n/);
                        if (text.length >= 2 && text[0].trim() && text[1].trim()) {
                            this.normalPassword = text[0].trim();
                            this.specialPassword = text[1].trim();
                            this.passwordFetchFailed = false;
                            this.passwordPrompt.textContent = '请输入访问密码：(游客密码1234567)';
                            this._log('已从服务器获取密码配置');
                        } else {
                            throw new Error('密码格式不正确');
                        }
                    } catch (e) {
                        this.normalPassword = BUILTIN_NORMAL_PASSWORD;
                        this.specialPassword = BUILTIN_SPECIAL_PASSWORD;
                        this.passwordFetchFailed = true;
                        this.passwordPrompt.textContent = `无法从服务器获取密码，已使用备用密码。\n获取错误：${e.message}\n提示：请用 http/https 方式打开本页面（不要直接双击打开本地文件）。\n请输入访问密码：`;
                        this._log(`密码获取失败，使用内置备用密码: ${e.message}`);
                    }
                    this.passwordInput.disabled = false;
                    this.passwordSubmitBtn.disabled = false;
                    this.passwordInput.focus();
                    this._setStatus('等待密码验证...', 'idle');
                }

                _handlePasswordSubmit() {
                    const pwd = this.passwordInput.value;
                    if (!pwd) { this.passwordError.textContent = '请输入密码'; return; }
                    // 在密码框输入 reset：重置记录（规则修正冷却 + 反重复座位历史）
                    if (pwd.trim().toLowerCase() === 'reset') {
                        localStorage.removeItem('iax_correct_rules_day');
                        localStorage.removeItem('iax_correct_rules_week');
                        this._clearSeatHistory();
                        this.correctRulesEnabled = true;
                        this.correctRulesApplyCount = 0;
                        this._repeatGuard = null;
                        this.passwordError.style.color = '#2e7d32';
                        this.passwordError.textContent = '✅ 已重置全部记录（规则修正冷却 + 座位历史），请输入访问密码继续。';
                        this.passwordInput.value = '';
                        this.passwordInput.focus();
                        return;
                    }
                    this.passwordError.style.color = '';
                    if (pwd === this.specialPassword) {
                        this._unlockApp('special', true);
                    } else if (pwd === this.normalPassword) {
                        this._unlockApp('normal', true);
                    } else if (pwd === GUEST_PASSWORD) {
                        this._unlockApp('guest', false);
                    } else {
                        this.passwordError.textContent = '密码错误，请重试。';
                        this.passwordInput.value = '';
                        this.passwordInput.focus();
                    }
                }

                _handlePasswordCancel() {
                    if (confirm('确定要退出吗？')) {
                        document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;color:#888;">已退出</div>';
                    }
                }

                _unlockApp(mode, exportMode) {
                    this.specialMode = (mode === 'special');
                    this.correctRulesEnabled = (mode === 'special' || mode === 'normal');
                    this.exportMode = exportMode;
                    this.visitorMode = !exportMode;
                    this.correctRulesApplyCount = 0;

                    this.passwordModal.style.display = 'none';
                    this.appContainer.style.display = 'flex';

                    this.modeBadge.className = 'mode-badge';
                    if (mode === 'special') {
                        this.modeBadge.classList.add('normal');
                        this.modeBadge.textContent = '✅ 普通模式';
                    } else if (mode === 'guest') {
                        this.modeBadge.classList.add('guest');
                        this.modeBadge.textContent = '👤 访客模式';
                    } else {
                        this.modeBadge.classList.add('normal');
                        this.modeBadge.textContent = '✅ 普通模式';
                    }

                    if (!exportMode) this.exportBtn.disabled = true;
                    if (this.visitorMode) {
                        this.guestPageSection.style.display = 'block';
                        this._loadGuestPageInfo();
                    }

                    this._updateButtonStates();
                    this._setStatus('就绪', 'active');
                    this._checkCachedData();
                }

                _updateButtonStates() {
                    this.generateBtn.disabled = (this.students.length === 0);
                    if (!this.exportMode) {
                        this.exportBtn.disabled = true;
                    } else {
                        this.exportBtn.disabled = !this._hasValidSeats();
                    }
                }

                _hasValidSeats() {
                    for (let r = 0; r < 7; r++) {
                        for (let c = 0; c < 8; c++) {
                            if (this.ans[r][c] && this.ans[r][c].trim() && this.ans[r][c] !== ' ') return true;
                        }
                    }
                    return false;
                }

                _checkCachedData() {
                    try {
                        const cs = localStorage.getItem('iax_students');
                        const cr = localStorage.getItem('iax_rules');
                        if (cs && cr) {
                            this.students = JSON.parse(cs);
                            this.rules = JSON.parse(cr);
                            this._log('已加载本地缓存数据');
                            this._updateButtonStates();
                        }
                    } catch (e) { /* 静默处理 */ }
                    // 座位历史（反重复）状态提示：还原卡重启后缓存会丢失，提醒导入
                    const histCount = this._loadSeatHistory().length;
                    if (histCount > 0) {
                        this._log(`📚 已加载座位历史 ${histCount} 条，反重复生效中`);
                    } else {
                        this._log('ℹ️ 未检测到座位历史：若本机重启会还原（冰点还原等），请先点「读取缓存」导入上次导出的座位表 txt');
                    }
                }

                // ---------- 网络请求 ----------
                async _fetchWithTimeout(url, options = {}) {
                    const timeout = options.timeout || 20000;
                    const controller = new AbortController();
                    const id = setTimeout(() => controller.abort(), timeout);
                    try {
                        const resp = await fetch(url, {
                            signal: controller.signal,
                            mode: 'cors',
                            cache: 'no-cache',
                            redirect: 'follow',
                            credentials: 'omit'
                        });
                        clearTimeout(id);
                        if (!resp.ok) throw new Error(`HTTP ${resp.status}: ${resp.statusText}`);
                        return await resp.text();
                    } catch (e) {
                        clearTimeout(id);
                        if (e.name === 'AbortError') throw new Error(`请求超时 (${timeout}ms)`);
                        throw e;
                    }
                }

                async _fetchText(url, timeout = 20000) {
                    const text = await this._fetchWithTimeout(url, { timeout: timeout });
                    return text.replace(/^\ufeff/, '');
                }

                // ---------- 在线获取名单 ----------
                async _handleDownload() {
                    if (this.downloading) { alert('正在获取远程名单，请稍候...'); return; }

                    this.downloading = true;
                    this.downloadBtn.disabled = true;
                    this._setStatus('正在从服务器获取数据...', 'busy');
                    this._log('开始在线获取数据...');

                    try {
                        if (this.isFileOrigin) {
                            this._log('检测到以本地文件方式打开，已切换为本地导入模式');
                            this._setStatus('需要导入本地文件', 'busy');
                            if (confirm('当前以本地文件方式打开（Origin: null），服务器会对在线请求返回 500。\n将打开 students.txt 与 rules.txt 供下载，然后选择文件导入。\n是否继续？')) {
                                try { window.open(`${this.remoteBaseUrl}/students.txt`, '_blank', 'noopener,noreferrer'); } catch (e) {}
                                try { window.open(`${this.remoteBaseUrl}/rules.txt`, '_blank', 'noopener,noreferrer'); } catch (e) {}
                                try { window.open(`${this.remoteBaseUrl}/password.txt`, '_blank', 'noopener,noreferrer'); } catch (e) {}
                                try { window.open(`${this.remoteBaseUrl}/page.txt`, '_blank', 'noopener,noreferrer'); } catch (e) {}
                            }
                            await this._importLocalFiles();
                            return;
                        }

                        const studentsText = await this._fetchText(`${this.remoteBaseUrl}/students.txt`);
                        let firstLine = null;
                        for (const line of studentsText.split(/\r?\n/)) {
                            const s = line.trim().replace(/^\ufeff/, '');
                            if (s) { firstLine = s; break; }
                        }
                        if (!firstLine) throw new Error('远程 students.txt 格式不正确');
                        this.students = firstLine.split(/\s+/).filter(s => s.length > 0);

                        const rulesText = await this._fetchText(`${this.remoteBaseUrl}/rules.txt`);
                        const rules = [];
                        for (const line of rulesText.split(/\r?\n/)) {
                            const s = line.trim().replace(/^\ufeff/, '');
                            const parts = s.split(/\s+/);
                            if (parts.length >= 3 && parts.length <= 7) {
                                rules.push(parts);
                            }
                        }
                        this.rules = rules;

                        try {
                            localStorage.setItem('iax_students', JSON.stringify(this.students));
                            localStorage.setItem('iax_rules', JSON.stringify(this.rules));
                        } catch (e) { /* 静默处理 */ }

                        this._log(`在线数据加载完成：${this.students.length} 名学生`);
                        this._setStatus('在线数据加载完成', 'active');
                        this._updateButtonStates();
                    } catch (e) {
                        this._log(`在线获取数据失败: ${e.message}`);
                        this._setStatus('获取失败', 'error');
                        alert(`无法从服务器读取名单:\n${e.message}`);
                    } finally {
                        this.downloading = false;
                        this.downloadBtn.disabled = false;
                        this._updateButtonStates();
                    }
                }

                // ========== 核心：随机座位生成（使用 window.crypto.getRandomValues 高随机性） ==========
                _generateSeats() {
                    if (this.students.length === 0) { alert('请先获取学生名单！'); return; }
                    this._setStatus('正在生成座位表...', 'busy');
                    this._log('🎲 开始生成座位表（增强随机引擎 v3）...');
                    this.generateBtn.disabled = true;

                    setTimeout(() => {
                        try {
                            this._randomSeat();
                            this._log('随机座位分配完成（增强随机引擎 v3 + 反重复）');
                            this._correctRules();
                            // ★ 二次修复：规则修正会交换学生，被换下来的人可能落回旧位置附近，
                            //    这里只交换"未被规则约束的学生"，因此不会破坏任何规则
                            if (this._repeatGuard && this._ruleLocked && this._ruleLocked.size) {
                                this._applyAntiRepeat(this._repeatGuard, this._ruleLocked);
                            }
                            this._updateSeatDisplay();
                            try {
                                this._log(this._repeatCheckText());
                                this._recordSeatHistory();
                            } catch (e2) { /* 记录失败不影响出表 */ }
                            this._setStatus('座位表生成完成', 'active');
                            this._log('✅ 座位表生成完成');
                        } catch (e) {
                            this._log(`生成失败: ${e.message}`);
                            this._setStatus('生成失败', 'error');
                        } finally {
                            this.generateBtn.disabled = false;
                            this._updateButtonStates();
                        }
                    }, 30);
                }

                /**
                 * 核心随机座位分配（增强版）
                 * 使用 batch entropy + 多轮 Fisher-Yates 洗牌 + crypto 随机索引矩阵
                 */
                _randomSeat() {
                    const rows = 7, cols = 8;
                    this.ans = Array.from({ length: rows }, () => new Array(cols).fill(' '));
                    this._ruleLocked = null;   // 规则锁在 _correctRules 中重建

                    const studentCount = this.students.length;
                    const shuffled = [...this.students];

                    // 使用批量随机值提升熵质量：一次性获取 256 个 32-bit 随机值（crypto + 时间熵混合，带兜底）
                    const entropyPool = new Uint32Array(256);
                    fillEntropyPool(entropyPool);
                    let entropyIdx = 0;
                    function batchedCryptoRandom() {
                        if (entropyIdx >= entropyPool.length) {
                            fillEntropyPool(entropyPool);
                            entropyIdx = 0;
                        }
                        return entropyPool[entropyIdx++] / 0x100000000;
                    }

                    // 多轮 Fisher-Yates 洗牌（3 轮），每轮独立随机化
                    for (let round = 0; round < 3; round++) {
                        for (let i = shuffled.length - 1; i > 0; i--) {
                            const j = Math.floor(batchedCryptoRandom() * (i + 1));
                            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
                        }
                    }

                    // 生成随机索引矩阵（确保有足够整数范围）
                    const matrixSize = rows * cols;
                    const maxIdx = Math.max(studentCount, matrixSize);
                    const indices = uniqueRandomMatrix(rows, cols, 1, maxIdx + 1, batchedCryptoRandom);

                    // 填入学生
                    for (let r = 0; r < rows; r++) {
                        for (let c = 0; c < cols; c++) {
                            const idx = indices[r][c] - 1;
                            if (idx < shuffled.length) this.ans[r][c] = shuffled[idx];
                        }
                    }

                    // ★ 反重复：先构建历史参照，再用"交换式修复"消除坐回原位/仍在邻座
                    this._repeatGuard = this._buildRepeatGuard();
                    this._antiRepeatStats = this._applyAntiRepeat(this._repeatGuard);
                    if (this._repeatGuard) {
                        this._log(`   ↳ 反重复修复：交换 ${this._antiRepeatStats.iterations} 次迭代 · 剩余 原位 ${this._antiRepeatStats.exact} / 邻座 ${this._antiRepeatStats.near}`);
                    }

                    const seedForLog = getStrongSeed();
                    this._log(`   ↳ 随机种子: ${seedForLog} | 熵池: batch-256 (crypto×时间熵) + 3轮洗牌 + 反重复修复`);
                }

                // ---------- 反重复：座位历史 ----------
                _loadSeatHistory() {
                    try {
                        const raw = localStorage.getItem(SEAT_HISTORY_KEY);
                        const arr = raw ? JSON.parse(raw) : [];
                        return Array.isArray(arr) ? arr.filter(e => e && e.seats) : [];
                    } catch (e) { return []; }
                }

                _saveSeatHistory(list) {
                    try {
                        localStorage.setItem(SEAT_HISTORY_KEY, JSON.stringify(list.slice(0, SEAT_HISTORY_MAX)));
                    } catch (e) { /* 忽略存储异常 */ }
                }

                _clearSeatHistory() {
                    try { localStorage.removeItem(SEAT_HISTORY_KEY); } catch (e) { /* 忽略 */ }
                }

                // 座位历史的文本块：随"导出座位表"一起落盘，重启（还原卡）后可用"读取缓存"还原
                _historyFileBlock() {
                    const list = this._loadSeatHistory();
                    return HISTORY_FILE_BEGIN + '\n' + JSON.stringify(list) + '\n' + HISTORY_FILE_END;
                }

                /**
                 * 从导出的 txt 中解析座位历史并合并进本地缓存
                 * @returns {number} 新增条数；-1 表示文件中没有可识别的缓存段
                 */
                _importHistoryText(text) {
                    if (!text) return -1;
                    const b = text.indexOf(HISTORY_FILE_BEGIN);
                    const e = text.indexOf(HISTORY_FILE_END);
                    if (b < 0 || e < 0 || e <= b) return -1;
                    let incoming;
                    try {
                        incoming = JSON.parse(text.slice(b + HISTORY_FILE_BEGIN.length, e).trim());
                    } catch (err) { return -1; }
                    if (!Array.isArray(incoming)) return -1;

                    const existing = this._loadSeatHistory();
                    const seen = new Set(existing.map(x => String(x.ts) + '|' + JSON.stringify(x.seats || {})));
                    let added = 0;
                    for (const entry of incoming) {
                        if (!entry || !entry.seats) continue;
                        const key = String(entry.ts) + '|' + JSON.stringify(entry.seats);
                        if (seen.has(key)) continue;
                        seen.add(key);
                        existing.push({ ts: entry.ts || Date.now(), seats: entry.seats });
                        added++;
                    }
                    existing.sort((x, y) => (y.ts || 0) - (x.ts || 0));
                    this._saveSeatHistory(existing);
                    return added;
                }

                // "读取缓存"按钮：选择导出的座位表 txt，还原反重复历史
                _handleLoadHistoryClick() {
                    this.historyFileInput.value = '';
                    this.historyFileInput.click();
                }

                async _onHistoryFileChosen(ev) {
                    const file = ev.target.files && ev.target.files[0];
                    if (!file) return;
                    this._setStatus('正在读取缓存...', 'busy');
                    try {
                        const text = await this._readFileAsText(file);
                        const added = this._importHistoryText(text);
                        if (added < 0) {
                            this._log('⚠️ 该文件中没有座位历史缓存段，请使用本系统"导出座位表"生成的 txt');
                            this._setStatus('缓存读取失败', 'error');
                            return;
                        }
                        const total = this._loadSeatHistory().length;
                        this._log(`📂 已读取座位历史：新增 ${added} 条，当前共 ${total} 条（反重复已生效）`);
                        this._setStatus('缓存读取完成', 'active');
                    } catch (e) {
                        this._log(`缓存读取失败: ${e.message}`);
                        this._setStatus('缓存读取失败', 'error');
                    }
                }

                _handleClearHistoryClick() {
                    if (!confirm('确定清空本机的座位历史缓存吗？\n（清空后下一次生成将不再避开历史座位）')) return;
                    this._clearSeatHistory();
                    this._repeatGuard = null;
                    this._log('🧹 已清空本机座位历史缓存');
                    this._setStatus('已清空缓存', 'active');
                }

                _snapshotSeats() {
                    const m = {};
                    for (let r = 0; r < 7; r++) {
                        for (let c = 0; c < 8; c++) {
                            const n = this.ans[r][c];
                            if (n && n !== ' ') m[n] = r + ',' + c;
                        }
                    }
                    return m;
                }

                // 每次生成完成后记录一张"实际使用的座位表"
                _recordSeatHistory() {
                    const snapshot = this._snapshotSeats();
                    if (!Object.keys(snapshot).length) return;
                    const list = this._loadSeatHistory();
                    list.unshift({ ts: Date.now(), seats: snapshot });
                    this._saveSeatHistory(list);
                }

                /**
                 * 构建反重复参照：
                 *  exact —— 最近 N 次抽座（优先取"非今天"的记录，保证跨周比较；再加上今天的预览记录）
                 *  near  —— 上一次（跨周优先）座位的周围一圈
                 *  refRow—— 上一次所在行（软约束：尽量避免整周同排）
                 */
                _buildRepeatGuard() {
                    const list = this._loadSeatHistory();
                    if (!list.length) return null;
                    const midnight = new Date();
                    midnight.setHours(0, 0, 0, 0);
                    const midnightTs = midnight.getTime();
                    const older = list.filter(e => e.ts < midnightTs);
                    const todays = list.filter(e => e.ts >= midnightTs);

                    const exactEntries = older.slice(0, ANTI_REPEAT.exactDraws);
                    // 同一天内反复预览时，也避免生成一模一样的表
                    for (const e of todays.slice(0, 2)) exactEntries.push(e);

                    const exact = new Map();
                    for (const entry of exactEntries) {
                        const seats = entry.seats || {};
                        for (const name in seats) {
                            if (!exact.has(name)) exact.set(name, new Set());
                            exact.get(name).add(seats[name]);
                        }
                    }

                    const ref = older[0] || list[0];
                    const near = new Map();
                    const refRow = new Map();
                    const refSeats = ref.seats || {};
                    for (const name in refSeats) {
                        const parts = String(refSeats[name]).split(',');
                        const r = parseInt(parts[0], 10), c = parseInt(parts[1], 10);
                        if (isNaN(r) || isNaN(c)) continue;
                        refRow.set(name, r);
                        const ring = new Set();
                        for (let dr = -ANTI_REPEAT.nearRadius; dr <= ANTI_REPEAT.nearRadius; dr++) {
                            for (let dc = -ANTI_REPEAT.nearRadius; dc <= ANTI_REPEAT.nearRadius; dc++) {
                                if (!dr && !dc) continue;
                                const rr = r + dr, cc = c + dc;
                                if (rr >= 0 && rr < 7 && cc >= 0 && cc < 8) ring.add(rr + ',' + cc);
                            }
                        }
                        near.set(name, ring);
                    }
                    return { exact, near, refRow, hasHistory: true };
                }

                // 代价：坐回原座位(100) > 仍在邻座(20) > 与上次同排(1)
                _repeatCost(guard, name, r, c) {
                    if (!guard) return 0;
                    const key = r + ',' + c;
                    let cost = 0;
                    const ex = guard.exact.get(name);
                    if (ex && ex.has(key)) cost += 100;
                    const nr = guard.near.get(name);
                    if (nr && nr.has(key)) cost += 20;
                    if (guard.refRow.get(name) === r) cost += 1;
                    return cost;
                }

                /**
                 * 交换式修复：通过学生之间互换座位，消除"坐回原位/仍在邻座"
                 * （只做交换，不改变"一人一座"，因此不会产生重复或空位）
                 * @param {object} guard 反重复参照
                 * @param {Set} locked 受规则约束、不允许被交换的学生（可为空）
                 */
                _applyAntiRepeat(guard, locked) {
                    const stats = { exact: 0, near: 0, rowsame: 0, iterations: 0, guard: !!guard };
                    if (!guard) return stats;
                    const isLocked = (n) => !!(locked && locked.has(n));
                    const names = [];
                    const pos = new Map();
                    for (let r = 0; r < 7; r++) {
                        for (let c = 0; c < 8; c++) {
                            const n = this.ans[r][c];
                            if (n && n !== ' ') { names.push(n); pos.set(n, { r, c }); }
                        }
                    }
                    if (names.length < 2) return stats;

                    const costs = new Map();
                    for (const n of names) {
                        const p = pos.get(n);
                        costs.set(n, this._repeatCost(guard, n, p.r, p.c));
                    }

                    const HARD = 20;   // 达到该代价视为需要修复（原位/邻座）
                    let failures = 0;
                    let iter = 0;
                    for (; iter < ANTI_REPEAT.maxIterations; iter++) {
                        const violators = names.filter(n => !isLocked(n) && costs.get(n) >= HARD);
                        if (!violators.length) break;
                        const a = violators[Math.floor(cryptoRandom() * violators.length)];
                        const pa = pos.get(a);
                        let bestB = null, bestDelta = 0;
                        for (let t = 0; t < ANTI_REPEAT.partnerTries; t++) {
                            const b = names[Math.floor(cryptoRandom() * names.length)];
                            if (b === a || isLocked(b)) continue;
                            const pb = pos.get(b);
                            const delta = (this._repeatCost(guard, a, pb.r, pb.c) + this._repeatCost(guard, b, pa.r, pa.c))
                                        - (costs.get(a) + costs.get(b));
                            if (delta < bestDelta) {
                                bestDelta = delta; bestB = b;
                                if (delta <= -HARD) break;   // 一次解决硬冲突，直接采用
                            }
                        }
                        if (bestB) {
                            const pb = pos.get(bestB);
                            const tmp = this.ans[pa.r][pa.c];
                            this.ans[pa.r][pa.c] = this.ans[pb.r][pb.c];
                            this.ans[pb.r][pb.c] = tmp;
                            pos.set(a, { r: pb.r, c: pb.c });
                            pos.set(bestB, { r: pa.r, c: pa.c });
                            costs.set(a, this._repeatCost(guard, a, pb.r, pb.c));
                            costs.set(bestB, this._repeatCost(guard, bestB, pa.r, pa.c));
                            failures = 0;
                        } else {
                            // 无法继续改进：达到上限后放弃剩余冲突（避免死循环）
                            if (++failures > names.length * 2) break;
                        }
                    }
                    for (const n of names) {
                        const p = pos.get(n);
                        const cost = this._repeatCost(guard, n, p.r, p.c);
                        if (cost >= 100) stats.exact++;
                        else if (cost >= HARD) stats.near++;
                        else if (cost >= 1) stats.rowsame++;
                    }
                    stats.iterations = iter;
                    return stats;
                }

                // 生成后的自检文案（对比历史，说明本次是否还有重复/邻座）
                _repeatCheckText() {
                    const guard = this._repeatGuard;
                    if (!guard) return '📌 反重复：首次运行，已建立本周基准座位（下周起自动避开旧座位与邻座）';
                    let exact = 0, near = 0, rowsame = 0, checked = 0;
                    for (let r = 0; r < 7; r++) {
                        for (let c = 0; c < 8; c++) {
                            const n = this.ans[r][c];
                            if (!n || n === ' ') continue;
                            checked++;
                            const cost = this._repeatCost(guard, n, r, c);
                            if (cost >= 100) exact++;
                            else if (cost >= 20) near++;
                            else if (cost >= 1) rowsame++;
                        }
                    }
                    return `📌 反重复检查（${checked} 人）：坐回原座位 ${exact} 人 · 仍在邻座 ${near} 人 · 同排 ${rowsame} 人`;
                }


                // ---------- 查找座位 ----------
                _findSeat(name) {
                    for (let r = 0; r < 7; r++) {
                        for (let c = 0; c < 8; c++) {
                            if (this.ans[r][c] === name) return { r, c };
                        }
                    }
                    return null;
                }

                // ---------- 辅助方法 ----------
                _buildPosMap() {
                    const m = new Map();
                    for (let r = 0; r < 7; r++) {
                        for (let c = 0; c < 8; c++) {
                            const name = this.ans[r][c];
                            if (name && name !== ' ') m.set(name, { r, c });
                        }
                    }
                    return m;
                }

                // 把某学生移到目标座位（与占位者交换；目标为空则直接坐下）
                _moveSeat(name, target, posMap) {
                    const p = posMap.get(name);
                    if (!p || (p.r === target.r && p.c === target.c)) return;
                    const occ = this.ans[target.r][target.c];
                    this.ans[target.r][target.c] = name;
                    this.ans[p.r][p.c] = (occ && occ !== ' ') ? occ : ' ';
                    posMap.set(name, { r: target.r, c: target.c });
                    if (occ && occ !== ' ' && occ !== name) posMap.set(occ, { r: p.r, c: p.c });
                }

                _swapSeats(r1, c1, r2, c2, posMap) {
                    const a = this.ans[r1][c1], b = this.ans[r2][c2];
                    this.ans[r1][c1] = b;
                    this.ans[r2][c2] = a;
                    if (a && a !== ' ') posMap.set(a, { r: r2, c: c2 });
                    if (b && b !== ' ') posMap.set(b, { r: r1, c: c1 });
                }

                _tryCollectAvailable(candidates, swapName, posMap, fixedSeats, protectedByRule3, protectedByDistance, constraintMap) {
                    const available = [];
                    for (const cand of candidates) {
                        const tr = cand.r, tc = cand.c;
                        const occupant = this.ans[tr][tc];
                        if (occupant === swapName) {
                            available.length = 0;
                            available.push(cand);
                            break;
                        }
                        if (occupant && occupant !== ' ') {
                            if (protectedByRule3.has(occupant) || protectedByDistance.has(occupant)) continue;
                            if (constraintMap && constraintMap.has(occupant)) continue; // 带约束的同学不能被挤占
                            const fixed = fixedSeats.get(occupant);
                            if (fixed && fixed.r === tr && fixed.c === tc) continue;
                        }
                        available.push(cand);
                    }
                    // 反重复偏好：优先选择不在"历史座位 / 上次邻座"上的候选位
                    // （规则修正也尽量不把同学放回原位；若全部候选都在旧位置附近，则退回原候选集）
                    if (this._repeatGuard && available.length > 1) {
                        const preferred = available.filter(cand =>
                            this._repeatCost(this._repeatGuard, swapName, cand.r, cand.c) < 20);
                        if (preferred.length) return preferred;
                    }
                    return available;
                }

                _pickAndSwap(available, cr, cc, posMap, protectedSet) {
                    if (!available.length) return false;
                    const pick = available[Math.floor(cryptoRandom() * available.length)];
                    if (pick.r === cr && pick.c === cc) return false;
                    this._swapSeats(cr, cc, pick.r, pick.c, posMap);
                    if (protectedSet) protectedSet.add(this.ans[pick.r][pick.c]);
                    return true;
                }

                _correctRules() {
                    if (!this.correctRulesEnabled) return;
                    const adminMode = this.specialMode;
                    const storageKey = adminMode ? 'iax_correct_rules_week' : 'iax_correct_rules_day';
                    const cooldownMs = adminMode ? 0 : 86400000;
                    if (cooldownMs > 0) {
                        const lastApply = parseInt(localStorage.getItem(storageKey) || '0');
                        if (Date.now() - lastApply < cooldownMs) return;
                    }
                    const nextAllowed = adminMode ? getWeekEnd() : (Date.now() + cooldownMs);
                    localStorage.setItem(storageKey, String(nextAllowed));
                    this.correctRulesApplyCount++;
                    if (!adminMode && this.correctRulesApplyCount > 1) this.correctRulesEnabled = false;

                    const R = 7, C = 8, rng = cryptoRandom;
                    const posMap = this._buildPosMap();

                    const fixedSeats = new Map();
                    for (const r of this.rules) {
                        if (r[0] === '2' && r.length === 4) {
                            const fr = parseInt(r[2]), fc = parseInt(r[3]);
                            if (!isNaN(fr) && !isNaN(fc)) fixedSeats.set(r[1], { r: fr, c: fc });
                        }
                    }

                    const protectedByRule3 = new Set();
                    const protectedByDistance = new Set();

                    // 被规则"锁住"的学生：本次生成中不允许再被反重复二次修复交换
                    // （含：被规则移动过的人、约束中作为参照的人、固定座位的人）
                    const ruleLocked = new Set();
                    this._ruleLocked = ruleLocked;
                    for (const fixedName of fixedSeats.keys()) ruleLocked.add(fixedName);

                    // ── 约束叠加 ──
                    // 同一人被多条移动规则命中时，后执行的规则只能在"仍满足此前已生效约束"的
                    // 座位中挑选，使多个约束可以同时成立（如：第4~6行 ∩ 左半区、距B=2 ∩ 不邻C）。
                    // 约束在规则生效（概率命中且人员在场）时登记；无法同时满足时保留旧约束、跳过本条。
                    const constraintMap = new Map();          // 姓名 -> [约束函数 fn(r,c)=>bool]
                    const addConstraint = (name, fn) => {
                        if (!constraintMap.has(name)) constraintMap.set(name, []);
                        constraintMap.get(name).push(fn);
                        ruleLocked.add(name);
                    };
                    const clearConstraints = (name) => { constraintMap.delete(name); };
                    const passConstraints = (name, r, c) => {
                        const arr = constraintMap.get(name);
                        if (!arr) return true;
                        return arr.every(fn => fn(r, c));
                    };
                    const C_dist = (nb, lo, hi) => {
                        ruleLocked.add(nb);
                        return (r, c) => {
